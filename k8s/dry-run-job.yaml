apiVersion: batch/v1
kind: Job
metadata:
  name: optilab-dry-run
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: dry-run
          image: optilab-runner:local
          imagePullPolicy: Never
          volumeMounts:
            - name: reports
              mountPath: /reports
      volumes:
        - name: reports
          emptyDir: {}
